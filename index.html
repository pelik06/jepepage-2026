<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>jepepage · a little universe</title>
    <meta name="description" content="A little universe made just for you — happy birthday, my love. Letters, memories and one last surprise." />
    <meta name="theme-color" content="#0B0A1F" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <style>
      /* static no-JS hero fallback — replaced by the app when it mounts */
      #root:empty::before {
        content: '';
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .boot-hero {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
        font-family: Georgia, 'Times New Roman', serif;
      }
      .boot-hero .boot-date {
        font-size: 13px;
        letter-spacing: 0.34em;
        color: rgba(200, 194, 232, 0.55);
        font-family: 'Century Gothic', 'Segoe UI', sans-serif;
      }
      .boot-hero h1 {
        margin-top: 20px;
        font-size: clamp(42px, 7vw, 76px);
        color: #f8f8ff;
        font-weight: 500;
        line-height: 1.1;
      }
      .boot-hero .boot-script {
        display: block;
        font-style: italic;
        color: #f4b8d8;
        font-size: clamp(48px, 8vw, 88px);
      }
      .boot-hero p {
        margin-top: 18px;
        color: #9d96c9;
        font-size: 17px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Static fallback: visible only until React replaces it (or if scripts never run) -->
      <div class="boot-hero" aria-hidden="true">
        <div>
          <div class="boot-date">09 · 29 · 2026</div>
          <h1>Happy Birthday,<br /><span class="boot-script">My Love</span></h1>
          <p>a little universe, just for you...</p>
        </div>
      </div>
    </div>
    <noscript>
      <div style="position: fixed; inset: auto 0 0 0; text-align: center; padding: 1rem; font-family: Georgia, serif; color: #c8c2e8;">
        This little universe needs JavaScript to shine — please enable it.
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
